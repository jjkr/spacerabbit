name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Build and package app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'QuickSpace ${{ github.ref_name }}'
          releaseBody: |
            ## QuickSpace ${{ github.ref_name }}
            
            ### Installation Instructions
            
            **Important**: This app uses macOS private APIs and is distributed directly (not notarized).
            
            #### For Apple Silicon Macs (M1/M2/M3):
            1. Download `QuickSpace_${{ github.ref_name }}_aarch64.dmg`
            2. Open the DMG and drag QuickSpace to Applications
            3. Right-click the app and select "Open" (required for first launch)
            4. Click "Open" when macOS warns about the unidentified developer
            
            #### For Intel Macs:
            1. Download `QuickSpace_${{ github.ref_name }}_x64.dmg`
            2. Follow the same installation steps as above
            
            #### Permissions Required:
            - **Accessibility**: For global hotkeys and workspace switching
            - **Input Monitoring**: For detecting keyboard shortcuts
            
            Grant these permissions in System Preferences > Security & Privacy > Privacy when prompted.
            
            ### What's New
            - Add your release notes here
            
          releaseDraft: true
          prerelease: false
          includeDebug: false
          includeRelease: true
          includeUpdaterJson: false
          args: --target universal-apple-darwin
